[package]
name = "quicknote-windows"
description = "QuickNote Windows 11 x64 生产壳"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quicknote-app = { path = "../../crates/quicknote-app" }
quicknote-ui = { path = "../../crates/quicknote-ui", features = ["desktop-windows"] }
serde_json.workspace = true
slint = { version = "1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "raw-window-handle-06",
    "renderer-software",
    "std",
] }
uuid = "1.18"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
winreg = "0.56"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
