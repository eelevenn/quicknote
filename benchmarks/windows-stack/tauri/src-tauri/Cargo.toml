[package]
name = "quicknote-stack-tauri"
version = "0.1.0"
description = "QuickNote Tauri benchmark prototype"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
quicknote-benchmark-support = { path = "../../rust-support" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
