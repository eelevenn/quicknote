name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared-core:
    name: Shared core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Slint 的 Linux 字体发现层需要 fontconfig.pc 才能编译。
      - name: Install Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check platform-neutral application module
        run: cargo check --locked --package quicknote-app --no-default-features
      - name: Lint shared crates
        run: cargo clippy --locked --workspace --exclude quicknote-windows --all-targets -- -D warnings
      - name: Test shared crates
        run: cargo test --locked --workspace --exclude quicknote-windows

  windows-release:
    name: Windows Release x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Build production shell
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - name: Reject dynamic VC Runtime dependencies
        shell: pwsh
        run: |
          .\scripts\Test-WindowsRuntimeDependencies.ps1 `
            -Path '.\target\x86_64-pc-windows-msvc\release\quicknote-windows.exe'
      - name: Build and inspect unsigned MSI
        shell: pwsh
        run: |
          .\scripts\Build-QuickNoteInstaller.ps1 -SkipApplicationBuild
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"$').Matches[0].Groups['version'].Value
          .\scripts\Test-QuickNoteInstaller.ps1 -InstallerPath ".\artifacts\release-candidate\QuickNote-$version-x64.msi" -AllowUnsigned
      - name: Test complete workspace
        run: cargo test --locked --workspace
