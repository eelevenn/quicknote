name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared-core:
    name: Shared core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Slint 的 Linux 字体发现层需要 fontconfig.pc 才能编译。
      - name: Install Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check platform-neutral application module
        run: cargo check --locked --package quicknote-app --no-default-features
      - name: Lint shared crates
        run: cargo clippy --locked --workspace --exclude quicknote-windows --all-targets -- -D warnings
      - name: Test shared crates
        run: cargo test --locked --workspace --exclude quicknote-windows

  windows-release:
    name: Windows Release x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Build production shell
        shell: pwsh
        run: .\scripts\build-windows.ps1
      # 每次成功构建都提供可安装的 MVP，不依赖签名申请或人工审核。
      - name: Package unsigned MVP and inspect runtime and MSI
        shell: pwsh
        run: .\scripts\New-QuickNoteMvp.ps1 -SkipApplicationBuild
      - name: Lint complete workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test complete workspace
        run: cargo test --locked --workspace
      - name: Upload runnable MVP
        uses: actions/upload-artifact@v4
        with:
          name: QuickNote-unsigned-mvp-x64
          path: artifacts/mvp/
          if-no-files-found: error
